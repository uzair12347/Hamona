<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Service</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">💰 Hamona International</div>
    <div class="nav-links">
       <a href="dashboard.html">Dashboard</a>
      <a href="plans.html">Plans</a>
      <a href="team.html">Team</a>
      <a href="my-plan.html">My Plan</a>
      <a href="deposit.html">Deposit</a>
      <a href="withdraw.html">Withdraw</a>
      <a href="deposit-history.html">Deposit History</a>
      <a href="withdraw-history.html">Withdraw History</a>
      <a href="task.html">Task</a>
      <a href="support.html">Support</a>
      <a href="#" id="logoutBtn" style="color:#ff5555;">Logout</a>
    </div>
  </nav>

  <div style="max-width:700px; margin:50px auto; padding:20px;">
    <div class="card">
      <h1 style="color:#ffd700; text-align:center;">📞 Customer Service</h1>
      <p style="color:#aaa; text-align:center; margin:10px 0 30px;">We're here to help 24/7</p>

      <div class="dashboard-grid" style="padding:0;">
        <a href="https://wa.me/923000000000" target="_blank" class="card" style="text-decoration:none; color:#fff; text-align:center;">
          <h2>💬 WhatsApp</h2>
          <p style="color:#aaa; font-size:13px;">Chat with support</p>
        </a>
        <a href="mailto:support@hamona.site" class="card" style="text-decoration:none; color:#fff; text-align:center;">
          <h2>📧 Email</h2>
          <p style="color:#aaa; font-size:13px;">support@hamona.site</p>
        </a>
        <a href="https://t.me/hamonasupport" target="_blank" class="card" style="text-decoration:none; color:#fff; text-align:center;">
          <h2>✈️ Telegram</h2>
          <p style="color:#aaa; font-size:13px;">@hamonasupport</p>
        </a>
      </div>

      <h2 style="color:#ffd700; margin:30px 0 15px;">Send us a Message</h2>
      <input type="text" id="subject" class="input-field" placeholder="Subject">
      <textarea id="message" class="input-field" rows="5" placeholder="Your message..." style="resize:vertical;"></textarea>
      <button class="btn" style="width:100%; margin-top:15px;" onclick="sendMessage()">Send Message</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '/firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let currentUser;
    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = 'login.html';
      currentUser = user;
    });

    window.sendMessage = async function() {
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;
      if (!subject || !message) { alert('Fill all fields'); return; }

      await addDoc(collection(db, 'support'), {
        userId: currentUser.uid,
        subject, message,
        status: 'open',
        createdAt: serverTimestamp()
      });

      alert('Message sent! We will respond soon.');
      document.getElementById('subject').value = '';
      document.getElementById('message').value = '';
    }

    window.logout = async () => {
      const { signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
      await signOut(auth);
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
