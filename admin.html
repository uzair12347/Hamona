<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Hamona International</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-header {
      background: linear-gradient(135deg, #ff5555, #d32f2f);
      color: #fff;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      margin-bottom: 20px;
    }
    .admin-header h2 { font-size: 26px; margin-bottom: 8px; }
    .admin-header p { font-size: 14px; opacity: 0.9; }

    .admin-tabs {
      display: flex;
      gap: 8px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    .admin-tab {
      flex: 1;
      min-width: 120px;
      padding: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid #ffd70033;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      color: #aaa;
      font-size: 13px;
      font-weight: 600;
    }
    .admin-tab.active {
      background: linear-gradient(135deg, #ffd700, #ffa500);
      color: #000;
      border-color: #ffd700;
    }
    .admin-tab .count {
      display: inline-block;
      background: #ff5555;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 5px;
    }
    .admin-tab.active .count {
      background: #000;
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid #ffd70033;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }
    .stat-card .num {
      font-size: 26px;
      font-weight: 700;
      color: #ffd700;
    }
    .stat-card .lbl {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    .request-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid #ffd70033;
      border-radius: 12px;
      padding: 18px;
      margin: 12px 0;
      transition: 0.3s;
    }
    .request-card:hover { border-color: #ffd700; }

    .request-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .request-user {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }
    .request-email {
      font-size: 12px;
      color: #888;
    }
    .status-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .status-pending { background: #ffa500; color: #000; }
    .status-approved { background: #28a745; color: #fff; }
    .status-rejected { background: #ff5555; color: #fff; }

    .request-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
      font-size: 13px;
    }
    .request-details .item {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 8px;
    }
    .request-details .item .lbl { color: #888; font-size: 11px; }
    .request-details .item .val { color: #fff; font-weight: 600; margin-top: 3px; }
    .request-details .item .val.gold { color: #ffd700; }

    .request-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .request-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      transition: 0.3s;
    }
    .btn-approve {
      background: linear-gradient(135deg, #28a745, #1e7e34);
      color: #fff;
    }
    .btn-approve:hover { transform: scale(1.02); }
    .btn-reject {
      background: linear-gradient(135deg, #ff5555, #d32f2f);
      color: #fff;
    }
    .btn-reject:hover { transform: scale(1.02); }
    .btn-disabled {
      background: rgba(255,255,255,0.1);
      color: #666;
      cursor: not-allowed;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }
    .empty-state .icon { font-size: 50px; margin-bottom: 15px; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 2px solid #ffd70055;
      border-radius: 18px;
      padding: 30px 25px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon { font-size: 50px; margin-bottom: 15px; }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .modal-message {
      font-size: 14px;
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 20px;
      white-space: pre-line;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .modal-btn-primary {
      background: linear-gradient(135deg, #ffd700, #ffa500);
      color: #000;
    }
    .modal-btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid #ffffff22 !important;
    }

    .user-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid #ffffff11;
      flex-wrap: wrap;
      gap: 10px;
    }
    .user-row .info { flex: 1; min-width: 200px; }
    .user-row .name { font-size: 14px; font-weight: 600; color: #fff; }
    .user-row .email { font-size: 11px; color: #888; }
    .user-row .balances {
      display: flex;
      gap: 15px;
      font-size: 12px;
    }
    .user-row .balances .bal {
      text-align: right;
    }
    .user-row .balances .bal .lbl { color: #888; font-size: 10px; }
    .user-row .balances .bal .val { color: #ffd700; font-weight: 700; }

    .search-input {
      width: 100%;
      padding: 12px 15px;
      background: rgba(0,0,0,0.3);
      border: 1px solid #ffd70055;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .search-input:focus {
      outline: none;
      border-color: #ffd700;
    }

    @media (max-width: 600px) {
      .request-details { grid-template-columns: 1fr; }
      .admin-tab { min-width: 80px; padding: 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">💰 Hamona Admin</div>
    <div class="nav-links">
      <a href="dashboard.html">User View</a>
      <a href="#" id="logoutBtn" style="color:#ff5555;">Logout</a>
    </div>
  </nav>

  <div style="padding:20px; max-width:1100px; margin:auto;">

    <div class="admin-header">
      <h2>🔐 Admin Control Panel</h2>
      <p>Welcome, <span id="adminName">Admin</span></p>
    </div>

    <!-- Stats -->
    <div class="dashboard-grid" style="padding:0; margin-bottom:20px;">
      <div class="stat-card">
        <div class="num" id="totalUsers">0</div>
        <div class="lbl">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="num" id="pendingDeposits">0</div>
        <div class="lbl">Pending Deposits</div>
      </div>
      <div class="stat-card">
        <div class="num" id="pendingWithdrawals">0</div>
        <div class="lbl">Pending Withdrawals</div>
      </div>
      <div class="stat-card">
        <div class="num" id="totalDepositSum">0</div>
        <div class="lbl">Total Deposits (PKR)</div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="admin-tabs">
      <div class="admin-tab active" data-tab="deposits">
        📥 Deposits <span class="count" id="depositCount">0</span>
      </div>
      <div class="admin-tab" data-tab="withdrawals">
        💸 Withdrawals <span class="count" id="withdrawCount">0</span>
      </div>
      <div class="admin-tab" data-tab="users">
        👥 Users
      </div>
    </div>

    <!-- Content -->
    <div id="contentArea">
      <div class="empty-state">⏳ Loading...</div>
    </div>

  </div>

  <!-- Modal -->
  <div id="modal" class="modal-overlay">
    <div class="modal-box" id="modalBox">
      <div class="modal-icon" id="modalIcon">⚠️</div>
      <div class="modal-title" id="modalTitle">Title</div>
      <div class="modal-message" id="modalMsg">Message</div>
      <div class="modal-actions">
        <button class="modal-btn-secondary" id="modalCancel" style="display:none;">Cancel</button>
        <button class="modal-btn-primary" id="modalOk">OK</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '/firebase-config.js';
    import { onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, updateDoc, collection, getDocs, query,
             where, orderBy, serverTimestamp, increment, addDoc }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    let currentAdmin = null;
    let currentTab = 'deposits';
    let depositsData = [];
    let withdrawalsData = [];
    let usersData = [];

    // ═══ MODAL ═══
    function showModal({ icon='⚠️', title, message, type='warning',
                        okText='OK', onOk=null, showCancel=false,
                        cancelText='Cancel' }) {
      const modal = document.getElementById('modal');
      const box = document.getElementById('modalBox');
      document.getElementById('modalIcon').innerText = icon;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = message;

      const titleEl = document.getElementById('modalTitle');
      if (type === 'error') {
        box.style.borderColor = '#ff555588';
        titleEl.style.color = '#ff5555';
      } else if (type === 'success') {
        box.style.borderColor = '#28a74588';
        titleEl.style.color = '#28a745';
      } else {
        box.style.borderColor = '#ffd70088';
        titleEl.style.color = '#ffd700';
      }

      const cancelBtn = document.getElementById('modalCancel');
      cancelBtn.style.display = showCancel ? 'block' : 'none';
      cancelBtn.innerText = cancelText;

      const okBtn = document.getElementById('modalOk');
      okBtn.innerText = okText;

      const newOk = okBtn.cloneNode(true);
      okBtn.parentNode.replaceChild(newOk, okBtn);
      newOk.onclick = () => { modal.classList.remove('show'); if (onOk) onOk(); };

      const newCancel = cancelBtn.cloneNode(true);
      cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
      newCancel.onclick = () => { modal.classList.remove('show'); };

      modal.classList.add('show');
    }

    // ═══ AUTH CHECK ═══
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }

      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const data = snap.data();

        // ✅ Admin check
        if (!data.isAdmin) {
          showModal({
            icon: '🔒', type: 'error', title: 'Access Denied',
            message: 'Aap admin nahin hain. Ye page sirf admin ke liye hai.',
            okText: 'Go to Dashboard',
            onOk: () => window.location.href = 'dashboard.html'
          });
          return;
        }

        currentAdmin = user;
        document.getElementById('adminName').innerText = data.fullname || 'Admin';

        // ✅ Sab data load karein
        await loadAllData();
        renderTab(currentTab);

      } catch (err) {
        console.error(err);
        document.getElementById('contentArea').innerHTML =
          `<div class="empty-state">❌ Error: ${err.message}</div>`;
      }
    });

    // ═══ LOAD ALL DATA ═══
    async function loadAllData() {
      // Deposits
      const depSnap = await getDocs(query(collection(db, 'deposits'), orderBy('createdAt', 'desc')));
      depositsData = depSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      // Withdrawals
      const wdSnap = await getDocs(query(collection(db, 'withdrawals'), orderBy('createdAt', 'desc')));
      withdrawalsData = wdSnap.docs.map(d => ({ id: d.id, ...d.data() }));

      // Users
      const usersSnap = await getDocs(collection(db, 'users'));
      usersData = usersSnap.docs.map(d => ({ uid: d.id, ...d.data() }));

      // ✅ Stats update
      document.getElementById('totalUsers').innerText = usersData.length;

      const pendingDeps = depositsData.filter(d => d.status === 'pending');
      const pendingWds = withdrawalsData.filter(w => w.status === 'pending');

      document.getElementById('pendingDeposits').innerText = pendingDeps.length;
      document.getElementById('pendingWithdrawals').innerText = pendingWds.length;
      document.getElementById('depositCount').innerText = pendingDeps.length;
      document.getElementById('withdrawCount').innerText = pendingWds.length;

      const totalDep = depositsData
        .filter(d => d.status === 'approved')
        .reduce((sum, d) => sum + (d.amount || 0), 0);
      document.getElementById('totalDepositSum').innerText =
        totalDep.toLocaleString();
    }

    // ═══ TAB RENDER ═══
    function renderTab(tab) {
      currentTab = tab;
      const content = document.getElementById('contentArea');

      if (tab === 'deposits') {
        if (depositsData.length === 0) {
          content.innerHTML = `<div class="empty-state">
            <div class="icon">📥</div>
            <p>Koi deposit request nahin</p>
          </div>`;
          return;
        }

        content.innerHTML = depositsData.map(d => {
          const user = usersData.find(u => u.uid === d.userId) || {};
          const dateStr = d.createdAt?.toDate
            ? d.createdAt.toDate().toLocaleString('en-GB')
            : 'N/A';

          return `
            <div class="request-card">
              <div class="request-header">
                <div>
                  <div class="request-user">${user.fullname || 'Unknown'}</div>
                  <div class="request-email">${user.email || d.userId.slice(0, 10) + '...'}</div>
                </div>
                <span class="status-badge status-${d.status}">${d.status}</span>
              </div>

              <div class="request-details">
                <div class="item">
                  <div class="lbl">Amount</div>
                  <div class="val gold">${d.amount} PKR</div>
                </div>
                <div class="item">
                  <div class="lbl">Method</div>
                  <div class="val">${d.method}</div>
                </div>
                <div class="item">
                  <div class="lbl">Transaction ID</div>
                  <div class="val">${d.txnId || 'N/A'}</div>
                </div>
                <div class="item">
                  <div class="lbl">Date</div>
                  <div class="val">${dateStr}</div>
                </div>
              </div>

              <div class="request-actions">
                ${d.status === 'pending' ? `
                  <button class="btn-reject" data-action="reject-deposit" data-id="${d.id}">❌ Reject</button>
                  <button class="btn-approve" data-action="approve-deposit" data-id="${d.id}">✅ Approve</button>
                ` : `
                  <button class="btn-disabled" disabled>Already ${d.status}</button>
                `}
              </div>
            </div>
          `;
        }).join('');
      }

      else if (tab === 'withdrawals') {
        if (withdrawalsData.length === 0) {
          content.innerHTML = `<div class="empty-state">
            <div class="icon">💸</div>
            <p>Koi withdrawal request nahin</p>
          </div>`;
          return;
        }

        content.innerHTML = withdrawalsData.map(w => {
          const user = usersData.find(u => u.uid === w.userId) || {};
          const dateStr = w.createdAt?.toDate
            ? w.createdAt.toDate().toLocaleString('en-GB')
            : 'N/A';

          return `
            <div class="request-card">
              <div class="request-header">
                <div>
                  <div class="request-user">${user.fullname || 'Unknown'}</div>
                  <div class="request-email">${user.email || w.userId.slice(0, 10) + '...'}</div>
                </div>
                <span class="status-badge status-${w.status}">${w.status}</span>
              </div>

              <div class="request-details">
                <div class="item">
                  <div class="lbl">Amount</div>
                  <div class="val gold">${w.amount} PKR</div>
                </div>
                <div class="item">
                  <div class="lbl">Method</div>
                  <div class="val">${w.method}</div>
                </div>
                <div class="item">
                  <div class="lbl">Account No</div>
                  <div class="val">${w.accountNo}</div>
                </div>
                <div class="item">
                  <div class="lbl">Holder</div>
                  <div class="val">${w.accountName}</div>
                </div>
                <div class="item">
                  <div class="lbl">Date</div>
                  <div class="val">${dateStr}</div>
                </div>
                <div class="item">
                  <div class="lbl">User Balance</div>
                  <div class="val">${user.withdrawBalance || 0} PKR</div>
                </div>
              </div>

              <div class="request-actions">
                ${w.status === 'pending' ? `
                  <button class="btn-reject" data-action="reject-withdraw" data-id="${w.id}">❌ Reject</button>
                  <button class="btn-approve" data-action="approve-withdraw" data-id="${w.id}">✅ Approve</button>
                ` : `
                  <button class="btn-disabled" disabled>Already ${w.status}</button>
                `}
              </div>
            </div>
          `;
        }).join('');
      }

      else if (tab === 'users') {
        content.innerHTML = `
          <input type="text" id="userSearch" class="search-input" placeholder="🔍 Search by name, email, or code...">
          <div id="userList"></div>
        `;

        renderUserList(usersData);

        document.getElementById('userSearch').addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase();
          const filtered = usersData.filter(u =>
            (u.fullname || '').toLowerCase().includes(q) ||
            (u.email || '').toLowerCase().includes(q) ||
            (u.referralCode || '').toLowerCase().includes(q)
          );
          renderUserList(filtered);
        });
      }

      // Event listeners attach karein
      content.querySelectorAll('button[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.dataset.action;
          const id = btn.dataset.id;
          handleAction(action, id);
        });
      });
    }

    // ═══ USER LIST RENDER ═══
    function renderUserList(list) {
      const container = document.getElementById('userList');
      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No users found</p></div>`;
        return;
      }

      container.innerHTML = list.slice(0, 100).map(u => `
        <div class="user-row">
          <div class="info">
            <div class="name">${u.fullname || 'Unknown'} ${u.isAdmin ? '👑' : ''}</div>
            <div class="email">${u.email || '-'}</div>
            ${u.referralCode ? `<div class="email">Code: <b style="color:#ffd700;">${u.referralCode}</b></div>` : ''}
          </div>
          <div class="balances">
            <div class="bal">
              <div class="lbl">Main</div>
              <div class="val">${(u.mainBalance || 0).toLocaleString()}</div>
            </div>
            <div class="bal">
              <div class="lbl">Withdraw</div>
              <div class="val">${(u.withdrawBalance || 0).toLocaleString()}</div>
            </div>
            <div class="bal">
              <div class="lbl">Deposit</div>
              <div class="val">${(u.totalDeposit || 0).toLocaleString()}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ═══ ACTION HANDLER ═══
    async function handleAction(action, id) {
      if (action === 'approve-deposit') {
        const dep = depositsData.find(d => d.id === id);
        if (!dep) return;

        showModal({
          icon: '✅', type: 'warning', title: 'Approve Deposit?',
          message: `Approve ${dep.amount} PKR deposit?\n\nYe user ke main balance mein add hoga AUR team commission distribute hogi.`,
          okText: 'Approve', showCancel: true,
          onOk: () => approveDeposit(dep)
        });
      }
      else if (action === 'reject-deposit') {
        const dep = depositsData.find(d => d.id === id);
        showModal({
          icon: '❌', type: 'error', title: 'Reject Deposit?',
          message: `Reject ${dep.amount} PKR deposit?`,
          okText: 'Reject', showCancel: true,
          onOk: () => rejectDeposit(dep)
        });
      }
      else if (action === 'approve-withdraw') {
        const wd = withdrawalsData.find(w => w.id === id);
        showModal({
          icon: '✅', type: 'warning', title: 'Approve Withdrawal?',
          message: `Approve ${wd.amount} PKR withdrawal?\n\nUser ke withdraw balance se kat jayega.`,
          okText: 'Approve', showCancel: true,
          onOk: () => approveWithdraw(wd)
        });
      }
      else if (action === 'reject-withdraw') {
        const wd = withdrawalsData.find(w => w.id === id);
        showModal({
          icon: '❌', type: 'error', title: 'Reject Withdrawal?',
          message: `Reject ${wd.amount} PKR withdrawal?`,
          okText: 'Reject', showCancel: true,
          onOk: () => rejectWithdraw(wd)
        });
      }
    }

    // ═══ APPROVE DEPOSIT + COMMISSION ═══
    async function approveDeposit(dep) {
      try {
        // 1. Deposit status update
        await updateDoc(doc(db, 'deposits', dep.id), {
          status: 'approved',
          approvedAt: serverTimestamp()
        });

        // 2. User ka main balance update
        await updateDoc(doc(db, 'users', dep.userId), {
          mainBalance: increment(dep.amount),
          totalDeposit: increment(dep.amount)
        });

        // 3. Team commission distribute karein (Level 1/2/3)
        await distributeCommission(dep.userId, dep.amount);

        showModal({
          icon: '🎉', type: 'success', title: 'Deposit Approved!',
          message: `${dep.amount} PKR approved.\nCommission bhi distribute ho gayi.`,
          okText: 'OK', onOk: () => location.reload()
        });
      } catch (err) {
        showModal({ icon: '❌', type: 'error', title: 'Error', message: err.message });
      }
    }

    // ═══ COMMISSION DISTRIBUTION ═══
    async function distributeCommission(userId, amount) {
      try {
        const userSnap = await getDoc(doc(db, 'users', userId));
        const user = userSnap.data();

        // LEVEL 1 (25%)
        if (user.referredBy) {
          const l1Amount = Math.floor(amount * 0.25);
          await updateDoc(doc(db, 'users', user.referredBy), {
            mainBalance: increment(l1Amount),
            withdrawBalance: increment(l1Amount),
            totalEarning: increment(l1Amount),
            'referralEarnings.level1': increment(l1Amount)
          });

          // LEVEL 2 (10%)
          const l1Snap = await getDoc(doc(db, 'users', user.referredBy));
          const l1Data = l1Snap.data();

          if (l1Data.referredBy) {
            const l2Amount = Math.floor(amount * 0.10);
            await updateDoc(doc(db, 'users', l1Data.referredBy), {
              mainBalance: increment(l2Amount),
              withdrawBalance: increment(l2Amount),
              totalEarning: increment(l2Amount),
              'referralEarnings.level2': increment(l2Amount)
            });

            // LEVEL 3 (3%)
            const l2Snap = await getDoc(doc(db, 'users', l1Data.referredBy));
            const l2Data = l2Snap.data();

            if (l2Data.referredBy) {
              const l3Amount = Math.floor(amount * 0.03);
              await updateDoc(doc(db, 'users', l2Data.referredBy), {
                mainBalance: increment(l3Amount),
                withdrawBalance: increment(l3Amount),
                totalEarning: increment(l3Amount),
                'referralEarnings.level3': increment(l3Amount)
              });
            }
          }
        }
      } catch (err) {
        console.error('Commission error:', err);
      }
    }

    // ═══ REJECT DEPOSIT ═══
    async function rejectDeposit(dep) {
      try {
        await updateDoc(doc(db, 'deposits', dep.id), {
          status: 'rejected',
          rejectedAt: serverTimestamp()
        });
        showModal({
          icon: '✅', type: 'success', title: 'Rejected',
          message: 'Deposit reject ho gaya.',
          okText: 'OK', onOk: () => location.reload()
        });
      } catch (err) {
        showModal({ icon: '❌', type: 'error', title: 'Error', message: err.message });
      }
    }

    // ═══ APPROVE WITHDRAW ═══
    async function approveWithdraw(wd) {
      try {
        await updateDoc(doc(db, 'withdrawals', wd.id), {
          status: 'approved',
          approvedAt: serverTimestamp()
        });

        await updateDoc(doc(db, 'users', wd.userId), {
          withdrawBalance: increment(-wd.amount)
        });

        showModal({
          icon: '🎉', type: 'success', title: 'Withdrawal Approved!',
          message: `${wd.amount} PKR approved.\nUser ke withdraw balance se kat gaya.`,
          okText: 'OK', onOk: () => location.reload()
        });
      } catch (err) {
        showModal({ icon: '❌', type: 'error', title: 'Error', message: err.message });
      }
    }

    // ═══ REJECT WITHDRAW ═══
    async function rejectWithdraw(wd) {
      try {
        await updateDoc(doc(db, 'withdrawals', wd.id), {
          status: 'rejected',
          rejectedAt: serverTimestamp()
        });
        showModal({
          icon: '✅', type: 'success', title: 'Rejected',
          message: 'Withdrawal reject ho gaya.',
          okText: 'OK', onOk: () => location.reload()
        });
      } catch (err) {
        showModal({ icon: '❌', type: 'error', title: 'Error', message: err.message });
      }
    }

    // ═══ TABS ═══
    document.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderTab(tab.dataset.tab);
      });
    });

    // ═══ LOGOUT ═══
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });
  </script>
</body>
