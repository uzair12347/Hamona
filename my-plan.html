<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Active Plan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">💰 Hamona International</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="plans.html">Plans</a>
      <a href="team.html">Team</a>
      <a href="my-plan.html">My Plan</a>
      <a href="deposit.html">Deposit</a>
      <a href="withdraw.html">Withdraw</a>
      <a href="deposit-history.html">Deposit History</a>
      <a href="withdraw-history.html">Withdraw History</a>
      <a href="task.html">Task</a>
      <a href="support.html">Support</a>
      <a href="#" id="logoutBtn" style="color:#ff5555;">Logout</a>
    </div>
  </nav>

  <div style="padding:30px; max-width:900px; margin:auto;">
    <h1 style="color:#ffd700;">My Active Plan</h1>

    <div id="planInfo" class="card" style="margin-top:20px;"></div>

    <h2 style="color:#ffd700; margin:30px 0 15px;">📅 Daily Earnings Record</h2>
    <div id="earningsTable" class="card"></div>
  </div>

  <script type="module">
    import { auth, db } from '/firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }

      const snap = await getDoc(doc(db, 'users', user.uid));
      const data = snap.data();
      const plan = data.activePlan;

      if (!plan) {
        document.getElementById('planInfo').innerHTML = 
          `<p style="text-align:center;">No active plan. <a href="plans.html" style="color:#ffd700;">Buy a plan</a></p>`;
        return;
      }

      document.getElementById('planInfo').innerHTML = `
        <h2 style="color:#ffd700;">${plan.name} Plan</h2>
        <div class="dashboard-grid" style="padding:0; margin-top:15px;">
          <div><p style="color:#aaa;">Investment</p><h3>${plan.price} PKR</h3></div>
          <div><p style="color:#aaa;">Daily Earning</p><h3 style="color:#28a745;">${plan.daily} PKR</h3></div>
          <div><p style="color:#aaa;">Days Completed</p><h3>${plan.daysCompleted}/${plan.days}</h3></div>
          <div><p style="color:#aaa;">Total Earned</p><h3 style="color:#ffd700;">${plan.earnedSoFar} PKR</h3></div>
        </div>
      `;

      // Load daily earnings
      const earningsSnap = await getDocs(collection(db, 'users', user.uid, 'earnings'));
      const earnings = earningsSnap.docs.map(d => d.data());

      if (earnings.length === 0) {
        document.getElementById('earningsTable').innerHTML = 
          '<p style="text-align:center; color:#aaa;">No earnings yet. First earning will appear within 24 hours.</p>';
      } else {
        document.getElementById('earningsTable').innerHTML = `
          <table style="width:100%; border-collapse:collapse;">
            <tr style="color:#ffd700; border-bottom:1px solid #ffd70033;">
              <th style="padding:10px; text-align:left;">Date</th>
              <th style="padding:10px; text-align:right;">Amount</th>
            </tr>
            ${earnings.map(e => `
              <tr style="border-bottom:1px solid #ffffff11;">
                <td style="padding:10px;">${e.date}</td>
                <td style="padding:10px; text-align:right; color:#28a745;">+${e.amount} PKR</td>
              </tr>
            `).join('')}
          </table>
        `;
      }
    });

    window.logout = async () => {
      const { signOut } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js");
      await signOut(auth);
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
