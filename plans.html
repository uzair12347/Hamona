<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Plans - Hamona International</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">💰 Hamona International</div>
    <div class="nav-links">
       <a href="dashboard.html">Dashboard</a>
      <a href="plans.html">Plans</a>
      <a href="team.html">Team</a>
      <a href="my-plan.html">My Plan</a>
      <a href="deposit.html">Deposit</a>
      <a href="withdraw.html">Withdraw</a>
      <a href="deposit-history.html">Deposit History</a>
      <a href="withdraw-history.html">Withdraw History</a>
      <a href="task.html">Task</a>
      <a href="support.html">Support</a>
      <a href="#" id="logoutBtn" style="color:#ff5555;">Logout</a>
    </div>
  </nav>

  <div style="padding:30px; max-width:1200px; margin:auto;">
    <h1 style="text-align:center; color:#ffd700;">Investment Plans</h1>
    <p style="text-align:center; color:#aaa; margin-bottom:30px;">Choose your plan and start earning daily</p>

    <div id="activePlanNotice" style="display:none; text-align:center; margin-bottom:20px;">
      <div style="background:rgba(0,200,83,0.1); border:1px solid #00c85355; padding:15px; border-radius:12px; display:inline-block;">
        <p style="color:#28a745; font-size:14px;">
          ✅ Aap ka <b id="activePlanName">-</b> plan active hai
        </p>
        <a href="my-plan.html" style="color:#ffd700; font-size:13px;">View My Plan →</a>
      </div>
    </div>

    <div class="dashboard-grid" id="plansGrid">
      <p style="text-align:center; color:#ffd700; grid-column:1/-1;">⏳ Loading plans...</p>
    </div>
  </div>

  <!-- Custom Modal -->
  <div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:9999; padding:20px;">
    <div id="modalBox" style="background:linear-gradient(135deg,#1a1a2e,#16213e); border:2px solid #ffd70055; border-radius:18px; padding:30px 25px; max-width:400px; width:100%; text-align:center;">
      <div id="modalIcon" style="font-size:50px; margin-bottom:15px;">⚠️</div>
      <h3 id="modalTitle" style="font-size:20px; margin-bottom:10px;">Title</h3>
      <p id="modalMsg" style="color:#ccc; font-size:14px; line-height:1.5; margin-bottom:20px;">Message</p>
      <div style="display:flex; gap:10px;">
        <button id="modalCancel" style="flex:1; padding:12px; border-radius:25px; border:1px solid #ffffff22; background:rgba(255,255,255,0.08); color:#fff; font-weight:600; cursor:pointer; display:none;">Cancel</button>
        <button id="modalOk" style="flex:1; padding:12px; border-radius:25px; border:none; background:linear-gradient(135deg,#ffd700,#ffa500); color:#000; font-weight:600; cursor:pointer;">OK</button>
      </div>
    </div>
  </div>

  <script type="module">
    // ✅ FIXED PATH
    import { auth, db } from '/firebase-config.js';
    import { onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, updateDoc, serverTimestamp, Timestamp }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // Plans: last 3 are LOCKED
    const plans = [
      { id: 1, name: 'Starter',  price: 500,   daily: 50,   days: 30, locked: false },
      { id: 2, name: 'Basic',    price: 1000,  daily: 110,  days: 30, locked: false },
      { id: 3, name: 'Silver',   price: 2500,  daily: 300,  days: 30, locked: false },
      { id: 4, name: 'Gold',     price: 5000,  daily: 650,  days: 30, locked: false },
      { id: 5, name: 'Platinum', price: 10000, daily: 1400, days: 30, locked: false },
      { id: 6, name: 'Diamond',  price: 25000, daily: 3800, days: 30, locked: true  },
      { id: 7, name: 'VIP',      price: 50000, daily: 8000, days: 30, locked: true  },
      { id: 8, name: 'Elite',    price: 100000,daily: 17000,days: 30, locked: true  }
    ];

    let currentUser = null;
    let userData = null;

    // ═══ MODAL ═══
    function showModal({ icon='⚠️', title, message, type='warning',
                        okText='OK', onOk=null, showCancel=false,
                        cancelText='Cancel', onCancel=null }) {
      const modal = document.getElementById('modal');
      const box = document.getElementById('modalBox');

      document.getElementById('modalIcon').innerText = icon;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMsg').innerText = message;

      // Colors
      if (type === 'error') {
        box.style.borderColor = '#ff555588';
        document.getElementById('modalTitle').style.color = '#ff5555';
      } else if (type === 'success') {
        box.style.borderColor = '#28a74588';
        document.getElementById('modalTitle').style.color = '#28a745';
      } else {
        box.style.borderColor = '#ffd70088';
        document.getElementById('modalTitle').style.color = '#ffd700';
      }

      const cancelBtn = document.getElementById('modalCancel');
      cancelBtn.style.display = showCancel ? 'block' : 'none';
      cancelBtn.innerText = cancelText;

      const okBtn = document.getElementById('modalOk');
      okBtn.innerText = okText;

      // Handlers
      const newOk = okBtn.cloneNode(true);
      okBtn.parentNode.replaceChild(newOk, okBtn);
      newOk.onclick = () => {
        modal.style.display = 'none';
        if (onOk) onOk();
      };

      const newCancel = cancelBtn.cloneNode(true);
      cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);
      newCancel.onclick = () => {
        modal.style.display = 'none';
        if (onCancel) onCancel();
      };

      modal.style.display = 'flex';
    }

    // ═══ AUTH + LOAD ═══
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUser = user;

      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        userData = snap.data();

        // Active plan notice
        if (userData.activePlan) {
          document.getElementById('activePlanNotice').style.display = 'block';
          document.getElementById('activePlanName').innerText = userData.activePlan.name;
        }

        renderPlans();
      } catch (err) {
        console.error(err);
        document.getElementById('plansGrid').innerHTML =
          `<p style="color:#ff5555; text-align:center;">❌ Error: ${err.message}</p>`;
      }
    });

    // ═══ RENDER PLANS ═══
    function renderPlans() {
      const grid = document.getElementById('plansGrid');
      const hasActivePlan = !!userData.activePlan;

      grid.innerHTML = plans.map(p => {
        // Agar user ka plan active hai to sab disabled
        const isDisabled = p.locked || hasActivePlan;
        const btnClass = isDisabled ? 'btn-locked' : 'btn';
        const btnText = p.locked
          ? '🔒 Locked'
          : (hasActivePlan ? '✅ Active Plan Exists' : 'Buy Now');

        return `
          <div class="plan-card ${p.locked ? 'locked' : ''}">
            <h2 style="color:#ffd700;">${p.name}</h2>
            <h1 style="margin:15px 0;">${p.price} PKR</h1>
            <p style="color:#aaa;">Daily: <b style="color:#28a745;">${p.daily} PKR</b></p>
            <p style="color:#aaa;">Duration: ${p.days} Days</p>
            <p style="color:#aaa;">Total Return: ${p.daily * p.days} PKR</p>
            <button class="${btnClass}" data-plan-id="${p.id}"
                    style="margin-top:15px; width:100%;"
                    ${isDisabled ? 'disabled' : ''}>
              ${btnText}
            </button>
          </div>
        `;
      }).join('');

      // ✅ Event listeners attach karein (onclick ki jagah)
      grid.querySelectorAll('button[data-plan-id]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.planId);
          buyPlan(id);
        });
      });
    }

    // ═══ BUY PLAN ═══
    async function buyPlan(id) {
      // CHECK 1: Plan already active?
      if (userData.activePlan) {
        showModal({
          icon: '✅', type: 'warning', title: 'Plan Already Active',
          message: `Aap ka "${userData.activePlan.name}" plan pehle se active hai. Pehle usko complete karne dein.`,
          okText: 'View My Plan',
          onOk: () => window.location.href = 'my-plan.html'
        });
        return;
      }

      const plan = plans.find(p => p.id === id);
      if (!plan) return;

      // CHECK 2: Locked?
      if (plan.locked) {
        showModal({
          icon: '🔒', type: 'error', title: 'Plan Locked',
          message: 'Ye plan filhal locked hai. Ye baad mein unlock hoga.',
          okText: 'OK'
        });
        return;
      }

      // CHECK 3: Balance kaafi hai?
      if ((userData.mainBalance || 0) < plan.price) {
        showModal({
          icon: '💵', type: 'error', title: 'Insufficient Balance',
          message: `Aap ka main balance ${userData.mainBalance || 0} PKR hai.\n"${plan.name}" plan ke liye ${plan.price} PKR chahiye.\n\nPehle deposit karein.`,
          okText: '💰 Deposit Now',
          onOk: () => window.location.href = 'deposit.html',
          showCancel: true,
          cancelText: 'Cancel'
        });
        return;
      }

      // CHECK 4: Confirm
      showModal({
        icon: '📈', type: 'warning', title: 'Confirm Purchase',
        message: `"${plan.name}" plan kharidna chahte hain?\n\nPrice: ${plan.price} PKR\nDaily Earning: ${plan.daily} PKR\nDuration: ${plan.days} days\n\nAap ka balance se ${plan.price} PKR kat jayega.`,
        okText: '✅ Confirm Buy',
        showCancel: true,
        cancelText: 'Cancel',
        onOk: () => actuallyBuyPlan(plan)
      });
    }

    // ═══ ACTUALLY BUY PLAN ═══
    async function actuallyBuyPlan(plan) {
      try {
        // ✅ 24 ghante baad ki timestamp calculate karein
        const nextEarningAt = Timestamp.fromDate(
          new Date(Date.now() + 24 * 60 * 60 * 1000)
        );

        await updateDoc(doc(db, 'users', currentUser.uid), {
          mainBalance: userData.mainBalance - plan.price,
          activePlan: {
            id: plan.id,
            name: plan.name,
            price: plan.price,
            daily: plan.daily,
            days: plan.days,
            daysCompleted: 0,
            earnedSoFar: 0,
            startDate: serverTimestamp(),          // ✅ Firestore timestamp
            nextEarningAt: nextEarningAt,          // ✅ 24 ghante baad
            lastEarningAt: null,
            status: 'active'
          }
        });

        showModal({
          icon: '🎉', type: 'success', title: 'Plan Activated!',
          message: `Aap ka "${plan.name}" plan activate ho gaya!\n\nPehli earning 24 ghante baad aayegi (${plan.daily} PKR).`,
          okText: 'View My Plan',
          onOk: () => window.location.href = 'my-plan.html'
        });

      } catch (err) {
        console.error(err);
        showModal({
          icon: '❌', type: 'error', title: 'Error',
          message: 'Plan activate nahin hua: ' + err.message,
          okText: 'OK'
        });
      }
    }

    // ═══ LOGOUT ═══
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await signOut(auth);
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
